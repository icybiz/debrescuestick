# Included only in the existing eorls.com TLS vhost, before its catch-all proxy.
# DRS_PORT is replaced by the operator after reserving/starting our own service.
ProxyPass /debrescuestick/sources/ !
Alias /debrescuestick/sources/ /var/lib/debrescuestick/public/sources/
<Directory /var/lib/debrescuestick/public/sources>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
</Directory>

RedirectMatch 301 ^/debrescuestick$ /debrescuestick/
ProxyPass /debrescuestick/ http://127.0.0.1:DRS_PORT/debrescuestick/ timeout=320 retry=0
ProxyPassReverse /debrescuestick/ http://127.0.0.1:DRS_PORT/debrescuestick/
<Location /debrescuestick/>
    RequestHeader unset X-DRS-Client
    RequestHeader set X-DRS-Client "expr=%{REMOTE_ADDR}"
</Location>
# The vhost's existing CustomLog also gets env=!drs_private at cutover.
SetEnvIf Request_URI "^/debrescuestick/" drs_private
